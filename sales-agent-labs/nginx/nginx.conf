# nginx Configuration for PresGen Sales Agent Labs
# Reverse proxy for 3-tier architecture
# Handles: Basic Auth, SSL termination, load balancing, caching

events {
    worker_connections 1024;  # Sufficient for demo
    use epoll;  # Efficient Linux event model
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===== Logging =====
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ===== Performance Tuning =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Hide nginx version

    # Client settings
    client_max_body_size 500M;  # Allow large file uploads (videos)
    client_body_buffer_size 5M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    # ===== Compression =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/xml
        image/svg+xml;
    gzip_disable "msie6";

    # ===== Rate Limiting =====
    # Prevent abuse - 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

    # ===== Upstream Services =====
    upstream presgen_ui {
        server presgen-ui:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream presgen_assess {
        server presgen-assess:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream presgen_core {
        server presgen-core:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ===== Caching =====
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=presgen_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # ===== Main Server Block =====
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ===== Health Check (No Auth) =====
        location /health {
            auth_basic off;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ===== Basic Authentication =====
        # Protects all routes except /health
        auth_basic "PresGen Demo - Authorized Access Only";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        # ===== Frontend (Next.js UI) =====
        location / {
            proxy_pass http://presgen_ui;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }


        # ===== URL Rewrites for UI Compatibility =====
        # Rewrite UI's incorrect paths to correct API endpoints
        rewrite ^/api/presgen/prompts/(.*)$ /api/v1/prompts/$1 last;
        rewrite ^/api/presgen-assess/(.*)$ /api/v1/$1 last;
        rewrite ^/render$ /core/render last;

        # ===== Assess API =====
        location /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://presgen_assess;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for AI processing
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering for file uploads
            proxy_request_buffering off;
        }

        # ===== Core API =====
        location /core/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://presgen_core/;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Very long timeouts for video processing
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Buffering for large files
            proxy_request_buffering off;
        }

        # ===== Training/Voice Profiles API =====
        location /training/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://presgen_core/training/;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ===== File Uploads (Special Handling) =====
        location /api/v1/workflows/upload {
            # Stricter rate limiting for uploads
            limit_req zone=upload_limit burst=5 nodelay;

            proxy_pass http://presgen_assess/api/v1/workflows/upload;

            # Increased limits for large Excel files
            client_max_body_size 100M;
            client_body_timeout 600s;

            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            proxy_request_buffering off;
        }

        # ===== Static Files (if served from nginx) =====
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ===== Generated Files (Optional - if served locally) =====
        location /outputs/ {
            alias /app/output/;
            expires 1h;
            add_header Cache-Control "public";
        }

        # ===== Deny access to sensitive files =====
        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~ /\.env {
            deny all;
        }
    }

    # ===== HTTPS Server Block (Optional - for Let's Encrypt SSL) =====
    # Uncomment when adding SSL certificate
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # SSL Configuration
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_tickets off;
    #
    #     # Modern SSL configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    #     ssl_prefer_server_ciphers off;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # ... (same location blocks as HTTP server)
    # }
}
